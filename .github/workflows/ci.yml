name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FLASK_ENV: testing
  HOST_EXECUTION_ENABLED: "0"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Python linter)
        run: ruff check .

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      docker:
        image: docker:27-dind
        options: --privileged
        ports:
          - 2375:2375
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Pre-pull sandbox Docker images
        run: |
          docker pull python:3.11-slim
          docker pull node:18-slim
          docker pull gcc:12
          docker pull openjdk:17-slim
        env:
          DOCKER_HOST: tcp://localhost:2375

      - name: Run pytest (with live Docker sandbox)
        run: python -m pytest -v
        env:
          DOCKER_HOST: tcp://localhost:2375

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
