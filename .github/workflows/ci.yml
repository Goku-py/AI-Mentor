name: CI

# NOTE (security): every `uses:` below is pinned to a floating major tag
# (@v4/@v5). Pinning to full commit SHAs is the recommended hardening step and
# is tracked as a known gap — the exact SHAs could not be verified here, and a
# wrong SHA silently breaks CI.
#
# No `concurrency:` group is set on purpose. Adding one that cancels in-flight
# runs would drop a running PR build on every new push; add one scoped with
# `cancel-in-progress: false` (or PR-only) if runners become contended.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FLASK_ENV: testing
  HOST_EXECUTION_ENABLED: "0"

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Python linter)
        run: ruff check .

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      docker:
        image: docker:27-dind
        options: --privileged
        ports:
          - 2375:2375
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pip-audit

      - name: pip audit
        run: pip-audit

      - name: Pre-pull sandbox Docker images (pinned by SHA256)
        run: |
          docker pull python:3.11-slim@sha256:b5d546c4bec684141f6eeb38593911c1ef56ca14f481a14c8a45c89c822a2857
          docker pull node:18-slim@sha256:ddb3a1b4a81ee454c147b0e9f87baa9eee8468c11ed5fca1c33204f73d48f1ef
          docker pull gcc:12@sha256:2f73c112972f5cb109ef3d5281cd64be78576e3cc97b662cd156694a85ae1284
          docker pull openjdk:17-slim@sha256:d78b76268a76f7f4d872faf78fdfff71e207cfd474f960572c3ab146e2640506
          # Tag them with short names so sandbox code can still reference them
          docker tag python:3.11-slim@sha256:b5d546c4bec684141f6eeb38593911c1ef56ca14f481a14c8a45c89c822a2857 python:3.11-slim
          docker tag node:18-slim@sha256:ddb3a1b4a81ee454c147b0e9f87baa9eee8468c11ed5fca1c33204f73d48f1ef node:18-slim
          docker tag gcc:12@sha256:2f73c112972f5cb109ef3d5281cd64be78576e3cc97b662cd156694a85ae1284 gcc:12
          docker tag openjdk:17-slim@sha256:d78b76268a76f7f4d872faf78fdfff71e207cfd474f960572c3ab146e2640506 openjdk:17-slim
        env:
          DOCKER_HOST: tcp://localhost:2375

      - name: Run pytest (with live Docker sandbox)
        # pytest.ini addopts carry --cov + the .coveragerc fail_under gate, so
        # this step also enforces the coverage floor.
        run: python -m pytest -v
        env:
          DOCKER_HOST: tcp://localhost:2375

  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # playwright.config.ts boots the Flask API via its `webServer` command.
      # There is no .venv on a GitHub runner, so the deps go onto the runner's
      # system interpreter instead.
      #
      # BLOCKER — playwright.config.ts (not this file's scope) currently hardcodes
      # a Windows-only launcher: `.venv\Scripts\python.exe app.py`. On the Linux
      # runner bash strips the backslashes and resolves that to
      # `.venvScriptspython.exe`, which does not exist, so this job WILL fail
      # until that command is made cross-platform (e.g. `python app.py`, or
      # `${PYTHON:-python} app.py`).
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: npx playwright test --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only meaningful on PRs — GitHub has no base commit on a push event.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  test-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.lock
      - name: Run migrations (upgrade)
        run: flask db upgrade
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          FLASK_ENV: testing

      - name: Verify rollback (downgrade)
        run: flask db downgrade
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          FLASK_ENV: testing
