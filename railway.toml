[build]
builder = "DOCKERFILE"

# No startCommand needed — the Dockerfile's CMD (gunicorn) handles it.
# Railway builds the image using the Dockerfile at the repo root, then
# runs the container with the Dockerfile's CMD.

# PostgreSQL service (provision via Railway dashboard → "New" → "Database" → "PostgreSQL")
# The DATABASE_URL env var will be auto-injected into the app service.
# After provisioning, run: railway run flask db upgrade

# ================================================================
# REQUIRED environment variables — set in Railway dashboard:
# ================================================================
#
#   SECRET_KEY                     — python -c "import secrets; print(secrets.token_hex(32))"
#   JWT_SECRET_KEY                 — python -c "import secrets; print(secrets.token_hex(32))"
#   WTF_CSRF_SECRET_KEY            — python -c "import secrets; print(secrets.token_hex(32))"
#   GEMINI_API_KEY                 — from https://aistudio.google.com/app/apikey
#   ALLOWED_ORIGINS                — exact frontend URL, e.g. https://your-app.railway.app
#   FLASK_ENV=production
#
#   Docker sandboxing is REQUIRED in production. Host execution is NOT allowed.
#   Do NOT set HOST_EXECUTION_ENABLED — the app will refuse to start if it is set.
#
#   ⚠ DO NOT SET FLASK_DEBUG — it overrides DEBUG=False per Flask framework.
#     If FLASK_DEBUG is set to any truthy value, ProductionConfig.validate()
#     will raise RuntimeError and the app will not start.
#
# ================================================================
# STRONGLY RECOMMENDED (multi-worker safety with Railway Redis plugin):
# ================================================================
#
#   Add a Redis plugin: Railway dashboard → "New" → "Database" → "Redis"
#   Railway auto-injects the REDIS_URL env var into the app service.
#   The app auto-detects REDIS_URL and configures:
#     - Global rate limiting (REDIS_URL/0)
#     - JWT blacklist (REDIS_URL/1)  ← token logout works server-side
#
#   ⚠ No additional env vars needed — just provision Redis and redeploy.
#     The /0 and /1 suffixes select different Redis logical databases
#     (0 for rate-limits, 1 for JWT blacklist). This prevents key collisions.
#     DO NOT set RATE_LIMIT_STORAGE_URI or JWT_BLACKLIST_STORAGE_URI
#     — the app handles them automatically.
#
# ================================================================
# OPTIONAL:
# ================================================================
#
#   GEMINI_MODEL                   — default gemini-2.5-flash; override to test newer models
#   ANALYZE_API_KEY                — shared secret for /analyze endpoint (prevents anonymous access)
#   LOG_LEVEL=INFO                 — Python logging level
#
#   ASYNC_ANALYZE_ENABLED=1        — enqueue /analyze requests as RQ background jobs
#   RQ_QUEUE_NAME=default          — RQ queue name (must match the worker service)
#   RQ_WORKER_TIMEOUT=300          — per-job timeout in seconds
#
#   DB_POOL_SIZE=3                 — SQLAlchemy pool size (production: size + overflow <= 20)
#   DB_MAX_OVERFLOW=5              — SQLAlchemy max overflow connections
#   DB_POOL_TIMEOUT=10             — seconds to wait for a connection from the pool
#   DB_POOL_RECYCLE=600            — seconds before recycling idle connections
#   DB_POOL_PRE_PING=true          — verify connections before use
#   DB_ECHO=false                  — echo SQL statements (debug only)
#
#   GEMINI_CIRCUIT_FAILURE_THRESHOLD=5   — consecutive Gemini failures before opening breaker
#   GEMINI_CIRCUIT_COOLDOWN_SECONDS=60   — seconds before half-open probe
#   GEMINI_CIRCUIT_HALF_OPEN_MAX=2       — probe calls while half-open
#
#   SANDBOX_SERVICE_URL            — optional external sandbox service URL
# ================================================================

# ================================================================
# WORKER SERVICE (required when ASYNC_ANALYZE_ENABLED=1):
# ================================================================
#
#   Create a second Railway service from the same repo and set:
#     Start command: python worker.py
#   Link the same Redis, Postgres, and env vars (except ASYNC_ANALYZE_ENABLED).
# ================================================================
