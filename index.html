    <script>
      // Pre-paint theme resolution. The stylesheet defaults to dark (:root);
      // this only has to add .light-mode for a returning visitor who chose
      // light, so the first paint is already correct and nothing flashes.
      // Mirrors useSettings.ts: darkMode is true unless stored as "false".
      try {
        if (localStorage.getItem("darkMode") === "false") {
          document.documentElement.classList.add("light-mode");
        }
      } catch (e) {
        /* private mode / storage blocked: keep the dark default */
      }
    </script>
